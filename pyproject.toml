[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.2" ]


[tool.poetry]
name = "wemake-python-styleguide"
version = "1.8.1"
description = "The strictest and most opinionated python linter ever"
license = "MIT"
authors = [
  "Nikita Sobolev <mail@sobolevn.me>",
]
readme = "README.md"
keywords = [
  "code quality",
  "flake8",
  "flake8-formatter",
  "flake8-plugin",
  "linter",
  "pycqa",
  "styleguide",
  "wemake.services",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Flake8",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
requires-poetry = ">=2.4"

[tool.poetry.dependencies]
python = "^3.10"
attrs = "*"
flake8 = "^7.3"
mcp = { version = "^2.0", extras = [ "cli" ], optional = true }
pygments = "^2.19"

[tool.poetry.group.dev.dependencies]
astpath = "^0.9"
covdefaults = "^2.3"
hypothesis = "^6.164"
hypothesmith = "^0.3"
import-linter = "^2.10"
lxml = "^6.0"
mypy = "^2.3"
nbqa = "^1.2"
pytest = "^9.1"
pytest-cov = "^7.0"
pytest-randomly = ">=4.1,<6.0"
pytest-xdist = "^3.8"
ruff = "^0.16"
syrupy = ">=5,<7"
types-flake8 = "^7.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
added-value = "^0.24"
furo = "^2025.12"
myst-parser = "^4.0"
sphinx = "^8.1"
sphinx-autodoc-typehints = "^3.0"
sphinx-llms-txt = "^0.7"
sphinxcontrib-mermaid = ">=1,<3"
tomli = "^2.0"

[tool.poetry.extras]
mcp = [ "mcp" ]

[tool.poetry.scripts]
wps = "wemake_python_styleguide.cli.cli_app:main"

[tool.poetry.plugins."flake8.extension"]
WPS = "wemake_python_styleguide.checker:Checker"

[tool.poetry.plugins."flake8.report"]
wemake = "wemake_python_styleguide.formatter:WemakeFormatter"

[tool.poetry.urls]
Funding = "https://opencollective.com/wemake-python-styleguide"
Homepage = "https://wemake-python-styleguide.rtfd.io"
Repository = "https://github.com/wemake-services/wemake-python-styleguide"


[tool.ruff]
target-version = "py310"
line-length = 80
extend-exclude = [
  # Intentionally bad code:
  "tests/**/__snapshots__/**",
  "tests/fixtures/**",
]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
# This is only required because we have invalid on-purpose code in docstrings:
docstring-code-format = false

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101", # asserts
  "S105", # hardcoded passwords
  "S404", # subprocess calls are for tests
  "S603", # do not require `shell=True`
  "S607", # partial executable paths
]
"wemake_python_styleguide/compat/nodes.py" = [ "ICN003", "PLC0414" ]
"wemake_python_styleguide/types.py" = [ "D102" ]
"wemake_python_styleguide/visitors/ast/*.py" = [ "N802" ]

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",    # We should be able to add docstrings to `@overload` decorators
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF067",  # wps handles `__init__.py` logic better
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]
flake8-import-conventions.aliases = { datetime = "dt" }
# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.codespell]
ignore-words-list = [
  "NotIn",
]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "_build",
  "tests/whitelist.txt",
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos.files]
# typos configuration: https://github.com/crate-ci/typos/
extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "*.lock",
  "tests/whitelist.txt",
]


[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
ignore_missing_imports = true
warn_unreachable = true
disable_error_code = [
  "no-untyped-def", # TODO: fix
]
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  # "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  # "explicit-override",
  # "mutable-override",
  "unimported-reveal",
  "unused-awaitable",
]
strict_equality_for_none = true
strict = true

[[tool.mypy.overrides]]
module = "wemake_python_styleguide.compat.nodes"
# We allow explicit `Any` only in this file, because of the compatibility:
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "wemake_python_styleguide.compat.packaging"
# We allow unused `ignore` comments, because we cannot sync it between versions:
warn_unused_ignores = false


[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  # pytest-cov
  "--cov=wemake_python_styleguide",
  "--cov=tests",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=100",
  # pytest-xdist
  "-n=auto",
  # Custom ignored dirs with bad code:
  "--ignore=tests/fixtures",
  "--ignore=docs",
]
# pytest config: http://doc.pytest.org/en/latest/customize.html
# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = [ "error" ]


[tool.coverage.run]
# Coverage configuration: https://coverage.readthedocs.io/
# We don't need to cover some files. They are fully checked with mypy.
# And don't contain any logic.
omit = [
  # All version specific tests:
  "tests/**/*312.py",
  "tests/**/*313.py",
  "tests/**/*315.py",
]
# Here we specify plugins for coverage to be used:
plugins = [
  "covdefaults",
]
# Required since 7.10:
patch = [
  "subprocess",
]
